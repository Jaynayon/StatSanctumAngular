<div class="modal-backdrop" (click)="onClose()"></div>
<div class="modal-content">
    <div *ngIf="!forgotPassword" class="container">
        <div class="title__container">
            <div class="title">{{title}}</div>
        </div>
        <div class="form__container">
            <div class="form__group">
                <input [formControl]="emailControl" type="input" class="form__field" placeholder="Email" name="email"
                    id='email' required />
                <label for="email" class="form__label">Email</label>
            </div>
            <div class="form__group">
                <input [formControl]="passwordControl" type="password" class="form__field" placeholder="Password"
                    name="password" id='password' required />
                <label for="password" class="form__label">Password</label>
            </div>
            <div class="entry-link" style="align-self: flex-end; margin-bottom: 20px;" (click)="onForgotPress($event)">
                Forgot password?</div>
        </div>
        <div class="button__container">
            <div
                style="display: flex; flex-direction: column; justify-content: space-between; max-height: 150px; min-height: 100px; flex-grow: 1;">
                <div class="button button__default" (click)="onSubmit()">
                    <span>{{titleLowercase}}</span>
                </div>
                <div class="button button__google" (click)="onClose()">
                    <div style="display: flex;">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/768px-Google_%22G%22_logo.svg.png"
                            alt="Google Logo" width="20" height="20" style="margin-right: 5px;" />
                        <span>{{titleLowercase}} with Google</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer__container">
            <div class="footer">
                <div class="entry-link">
                    {{entryLinkAdverb}} have an account?&nbsp;<span class="register-text"
                        (click)="onRegisterPress($event)">{{entryLink}}</span>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="forgotPassword" class="container">
        <div (click)="onForgotPress($event)">Forgot password was clicked</div>
    </div>
</div>
